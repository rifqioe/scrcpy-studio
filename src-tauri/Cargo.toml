[package]
name = "scrcpy-studio"
version = "0.1.0"
description = "A desktop GUI for scrcpy"
authors = ["scrcpy-studio contributors"]
license = "MIT"
repository = "https://github.com/rifqioe/scrcpy-studio"
edition = "2021"

[lib]
name = "scrcpy_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
zip = "2"
sha2 = "0.10"
dirs = "5"
rand = "0.8"
mdns-sd = "0.11"
flume = "0.11"

[target.'cfg(windows)'.dependencies]
mslnk = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[dev-dependencies]
tempfile = "3"
